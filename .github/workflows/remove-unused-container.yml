name: Remove unused backend-private container
on:
  push:
    branches: [container-publishing]
    paths: [.github/workflows/remove-unused-container.yml]
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the unused duplicate
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('DELETE /users/{username}/packages/{package_type}/{package_name}', {
                username: context.repo.owner,
                package_type: 'container',
                package_name: 'google-review-extension-backend-private'
              });
              core.notice('Removed google-review-extension-backend-private; original package retained.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('Unused duplicate package is already absent.');
            }
