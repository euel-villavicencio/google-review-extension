name: Publish backend container

on:
  push:
    branches: [main, container-publishing]
    paths:
      - backend-python/**
      - .dockerignore
      - .github/workflows/publish-container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/google-review-extension
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/container-publishing' }}
      - name: Verify package is private
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pkg } = await github.request('GET /users/{username}/packages/{package_type}/{package_name}', {
              username: context.repo.owner,
              package_type: 'container',
              package_name: 'google-review-extension'
            });
            core.notice(`Container package visibility: ${pkg.visibility}`);
            if (pkg.visibility !== 'private') {
              core.setFailed('Container package must be private. Check its GitHub package settings.');
            }
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend-python/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
